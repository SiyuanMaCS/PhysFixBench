度大于液体，入水后应下沉至杯底，但在整个片段中（0.67s–5.0s）始终漂浮在液面附近，未发生下沉，违反浮力/重力规律。\n【应修改为】\n1. 多米诺骨牌入水后应保持与入水前一致的长方体三维形态，即使在液体中下沉或漂浮，其厚度与体积感应与入水前一致，不应塌缩为薄片状。\n2. 陶瓷多米诺骨牌入水后应因密度大于液体而下沉至杯底，液面可产生波纹与气泡，但骨牌最终应静止于杯底而非漂浮在液面。\n请保持保留入水前白色长方体三维多米诺骨牌、蓝色杯子、深色液体、木质桌面、液面波纹与气泡等内容；修正骨牌入水后的形态（保持长方体厚度）与浮力行为（下沉至杯底）。，修正上述物理问题。", "source_dataset": "physicsiq", "source_label": "Physics-IQ", "screen": "fixable", "human_review_status": "pending", "human_confirmed": false, "evidence_zh": "原生帧证据：nf1(t=0.0)与nf13(t=0.5)显示入水前后的白色多米诺骨牌为具有明显厚度的三维长方体块；nf19(t=0.75)起骨牌在液面呈现为异常薄的条带/薄片状，与入水前厚实形态不符；nf25(t=1.0)、nf30(t=1.2)进一步确认薄片状外观；nf60(t=2.46)、nf66(t=2.71)、nf72(t=2.96)、nf78(t=3.21)显示骨牌始终漂浮于液面附近而未下沉至杯底。6fps关键帧f1/f4/f5/f6/f7/f8/f9显示形态由厚变薄，f13/f17/f21/f25/f29/f31显示持续漂浮。", "cards": [{"t_start": 0.42, "t_end": 1.0, "problem_zh": "白色陶瓷多米诺骨牌入水后形态异常：入水前为具有明显厚度的三维长方体块，入水后（约0.6s起）在液面呈现为异常薄的条带/薄片状，不再保持入水前的长方体厚度与体积感。", "expected_zh": "多米诺骨牌入水后应保持与入水前一致的长方体三维形态，即使在液体中下沉或漂浮，其厚度与体积感应与入水前一致，不应塌缩为薄片状。", "evidence_frames_6fps": [1, 4, 5, 6, 7, 8, 9], "keep_zh": "入水前的白色长方体三维形态、深色液体与蓝色杯子、液面波动等其余内容保留；仅修正骨牌入水后的形态使其保持长方体厚度。"}, {"t_start": 0.67, "t_end": 5.0, "problem_zh": "陶瓷多米诺骨牌密度大于液体，入水后应下沉至杯底，但在整个片段中（0.67s–5.0s）始终漂浮在液面附近，未发生下沉，违反浮力/重力规律。", "expected_zh": "陶瓷多米诺骨牌入水后应因密度大于液体而下沉至杯底，液面可产生波纹与气泡，但骨牌最终应静止于杯底而非漂浮在液面。", "evidence_frames_6fps": [5, 9, 13, 17, 21, 25, 29, 31], "keep_zh": "液面波纹、气泡、深色液体颜色、杯子与桌面等其余内容保留；仅修正骨牌的浮力行为使其下沉至杯底。"}], "duration_s": 5.057, "source_prompt": "Static locked-off single-shot with fixed frame throughout filmed with constant framerate in real-time. The scene shows a realistic scientific demonstration. The scene only contains the described setup and actions. The mug is sitting on a wooden surface. The blue-black grabber tool drops the white ceramic domino into the mug that is filled with a dark-colored liquid."}, {"dir_name": "physicsiq__v2_0047", "record_id": "physicsiq::v2::0047", "slot": 92, "generator": "Seedance 2.5 I2V (Physics-IQ Verified, bpp_base, take-1 switch frame)", "error_family": "motion_force", "glitch_cat  const chunk=SELECTED.slice(PAGE*PAGE_SIZE,(PAGE+1)*PAGE_SIZE);
 $('cards').innerHTML=chunk.map(r=>{const e=edit(r),url=MODE==='local'?'videos/'+encodeURIComponent(r.dir_name)+'.mp4':'https://huggingface.co/datasets/HuggingFriends/PhysFixBench/resolve/main/videos/'+encodeURIComponent(r.dir_name)+'.mp4';return `<article class="card" data-rid="${esc(r.record_id)}"><div class="head"><b>${esc(r.record_id)}</b><span class="badge">${esc(r.source_label)}</span><span class="badge">${esc(r.generator)}</span><span class="badge ${r.confidence<.75?'low':''}">agent置信度 ${r.confidence.toFixed(2)}</span><span class="badge">${r.screen==='fixable'?'推荐候选':'未推荐 · 供补捞'}</span></div>
 <div class="layout"><div><video controls preload="none" playsinline src="${esc(url)}"></video><div class="timings">${r.cards.map(c=>`<button data-seek="${Number(c.t_start)}">▶ ${Number(c.t_start).toFixed(1)}–${Number(c.t_end).toFixed(1)} 秒</button>`).join('')}<select data-speed aria-label="播放速度"><option value="1">1×</option><option value="0.5">0.5×</option><option value="0.25">0.25×</option></select></div><p class="count">${r.needs_human_frame_step_confirmation?'建议重点慢放确认边界或细微证据。':'点击时间区间查看问题，或播放完整视频核对。'}</p><div class="media-error error" hidden>视频加载失败，请使用 <a href="${esc(url)}" target="_blank" rel="noopener">视频直链</a>。</div><details><summary>agent 证据与复核说明</summary><div class="evidence">${esc(r.evidence_zh)}</div></details><details><summary>来源标注原文（溯源）</summary><pre>${esc(r.annotation)}</pre></details></div>
 <div><div class="field"><strong>问题（含发生时间）</strong><textarea class="problems" data-field="fix_problems" aria-label="问题">${esc(e.fix_problems)}</textarea></div><div class="field"><strong>应修改为（与问题逐条对应）</strong><textarea class="expected" data-field="fix_expected" aria-label="应修改为">${esc(e.fix_expected)}</textarea></div><div class="field"><strong>保持不变</strong><textarea class="keep" data-field="fix_keep" aria-label="保持不变">${esc(e.fix_keep)}</textarea></div><div class="decisions"><strong>人工结论</strong>${[['pass','通过'],['edit','需修改'],['reject','驳回']].map(([v,t])=>`<label><input type="radio" name="decision-${esc(r.dir_name)}" value="${v}" ${e.decision===v?'checked':''}>${t}</label>`).join('')}<button data-clear>清除结论</button></div><textarea class="note" data-field="note" placeholder="备注、存疑点或补充问题" aria-label="备注">${esc(e.note)}</textarea></div></div></article>`;}).join('')||'<div class="empty">当前条件没有样本</div>';
 $('page').textContent=`${SELECTED.length?PAGE+1:0} / ${Math.ceil(SELECTED.length/PAGE_SIZE)} 页`; $('prev').disabled=PAGE===0;$('next').disabled=(PAGE+1)*PAGE_SIZE>=SELECTED.length;
 document.querySelectorAll('video').forEach(v=>v.addEventListener('error',()=>v.closest('.card').querySelector('.media-error').hidden=false));
}
function save(card){const r=ITEMS.find(x=>x.record_id===card.dataset.rid),e=baseEdit(r);card.querySelectorAll('[data-field]').forEach(x=>e[x.dataset.field]=x.value);e.decision=card.querySelector('input[type=radio]:checked')?.value||'';e.updated_at=new Date().toISOString();SAVED[r.record_id]=e;try{localStorage.setItem(KEY,JSON.stringify(SAVED));$('status').textContent='已暂存；完成后请导出回传';}catch(err){$('status').textContent='缓存失败，请立即导出结果';}const completed=ITEMS.filter(x=>SAVED[x.record_id]?.decision).length;$('count').textContent=`当前 ${SELECTED.length} 条 · 全部可复核 ${ITEMS.length} 段 · 人工已填写结论 ${completed} 条`;}
$('cards').addEventListener('input',ev=>{const card=ev.target.closest('.card');if(card&&ev.target.matches('[data-field],input[type=radio]'))save(card);});
$('cards').addEventListener('change',ev=>{const card=ev.target.closest('.card');if(ev.target.matches('[data-speed]'))card.querySelector('video').playbackRate=Number(ev.target.value);if(ev.target.matches('input[type=radio]'))save(card);});
$('cards').addEventListener('click',ev=>{const b=ev.target.closest('button'),card=b?.closest('.card');if(!card)return;if(b.hasAttribute('data-seek')){const v=card.querySelector('video'),t=Number(b.dataset.seek);if(v.readyState>=1){v.currentTime=t;v.play().catch(()=>{});}else{v.addEventListener('loadedmetadata',()=>{v.currentTime=t;v.play().catch(()=>{});},{once:true});v.load();}}if(b.hasAttribute('data-clear')){card.querySelectorAll('input[type=radio]').forEach(x=>x.checked=false);save(card);}});
for(const id of ['source','scope','state'])$(id).addEventListener('change',()=>{PAGE=0;filter();});$('search').addEventListener('input',()=>{PAGE=0;filter();});$('prev').onclick=()=>{PAGE--;render();window.scrollTo(0,0);};$('next').onclick=()=>{PAGE++;render();window.scrollTo(0,0);};
$('export').onclick=()=>{const result={batch:'batch2',exported_at:new Date().toISOString(),total_candidates:ITEMS.filter(r=>r.screen==='fixable').length,rows:ITEMS.filter(r=>SAVED[r.record_id]).map(r=>{const e=edit(r);return {...e,original_fix_problems:r.fix_problems,original_fix_expected:r.fix_expected,original_fix_keep:r.fix_keep,human_confirmed:e.decision==='pass',fix_problems:e.fix_problems.split('\n').filter(x=>x.trim()),fix_expected:e.fix_expected.split('\n').filter(x=>x.trim())};})};const blob=new Blob([JSON.stringify(result,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='physfixbench_batch2_human_review_'+new Date().toISOString().slice(0,10)+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000);};
$('import').onclick=()=>$('import-file').click();$('import-file').onchange=async ev=>{try{const d=JSON.parse(await ev.target.files[0].text());if(d.batch!=='batch2'||!Array.isArray(d.rows))throw new Error('不是 batch2 审核结果');let n=0;for(const e of d.rows){if(!ITEMS.some(r=>r.record_id===e.record_id)||!['','pass','edit','reject'].includes(e.decision))continue;SAVED[e.record_id]={...e,fix_problems:Array.isArray(e.fix_problems)?e.fix_problems.join('\n'):String(e.fix_problems||''),fix_expected:Array.isArray(e.fix_expected)?e.fix_expected.join('\n'):String(e.fix_expected||'')};n++;}localStorage.setItem(KEY,JSON.stringify(SAVED));filter();$('status').textContent=`已导入 ${n} 条审核记录`;}catch(e){$('status').textContent='导入失败：'+e.message;}ev.target.value='';};
filter();
</script></body></html>
